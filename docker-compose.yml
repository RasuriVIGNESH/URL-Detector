services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
  frontend:
    build: .
    env_file: .env
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - api
